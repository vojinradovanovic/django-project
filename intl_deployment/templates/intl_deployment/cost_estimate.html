<form action="{% url 'intl_deployment:cost_estimate' %}" method="post">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Submit">
</form>

{% if data %}
    <table>
        <tr>
            <th>HOME PAY</th>
        </tr>

        {% for field, value in data.home_pay.items %}
            <tr>
                <td>{{ field }}</td>
                <td>{{ value }}</td>
            </tr>
        {% endfor %}
    </table>
{% endif %}
